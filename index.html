<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRAVEL SCHEDULER</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="header-top">
    <div>
      <span class="eyebrow">TRAVEL SCHEDULER</span>
      <h1>도도♥️쥬쥬's TRAVEL SCHEDULER</h1>
    </div>
    <a href="admin.html" class="info-btn">⚙️ 관리</a>
  </div>
</header>

<div class="trips-layout" id="tripsList">
  <p class="empty-hint" style="margin-top:16px;">불러오는 중...</p>
</div>

<script src="data.js"></script>
<script>
(async function () {
  const el = document.getElementById('tripsList');

  let trips;
  try {
    trips = await fetchTrips();
  } catch (e) {
    el.textContent = '';
    const msg = document.createElement('p');
    msg.className = 'trips-empty';
    msg.textContent = '데이터를 불러오지 못했습니다.';
    el.appendChild(msg);
    return;
  }

  el.textContent = '';

  if (!trips.length) {
    const msg = document.createElement('p');
    msg.className = 'trips-empty';
    msg.textContent = '등록된 여행이 없습니다. 관리 페이지에서 추가해주세요.';
    el.appendChild(msg);
    return;
  }

  function formatDate(d) {
    return d ? d.replace(/-/g, '.') : '';
  }
  function formatDateRange(start, end) {
    if (start && end) return formatDate(start) + ' ~ ' + formatDate(end);
    if (start) return formatDate(start) + ' ~';
    if (end) return '~ ' + formatDate(end);
    return '';
  }
  function calcDuration(start, end) {
    if (!start || !end) return null;
    const nights = Math.round((new Date(end) - new Date(start)) / 86400000);
    if (nights === 0) return '당일치기';
    return nights + '박 ' + (nights + 1) + '일';
  }

  trips.forEach(function (trip) {
    const a = document.createElement('a');
    a.className = 'trip-card';
    a.href = 'schedule.html?trip=' + encodeURIComponent(trip.id);

    const body = document.createElement('div');
    body.className = 'trip-card-body';

    const title = document.createElement('div');
    title.className = 'trip-card-title';
    title.textContent = trip.title;

    const dateRange = formatDateRange(trip.start_date, trip.end_date);
    const duration = calcDuration(trip.start_date, trip.end_date);

    if (dateRange) {
      const dateEl = document.createElement('div');
      dateEl.className = 'trip-card-meta';
      dateEl.textContent = dateRange;
      body.appendChild(title);
      body.appendChild(dateEl);
    } else {
      body.appendChild(title);
    }

    if (duration) {
      const durEl = document.createElement('div');
      durEl.className = 'trip-card-duration';
      durEl.textContent = duration;
      body.appendChild(durEl);
    }

    const arrow = document.createElement('span');
    arrow.className = 'trip-card-arrow';
    arrow.textContent = '→';

    a.appendChild(body);
    a.appendChild(arrow);
    el.appendChild(a);
  });
})();
</script>

</body>
</html>
