<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 여행</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="header-top">
    <div>
      <span class="eyebrow">TRAVEL SCHEDULE</span>
      <h1>나의 여행</h1>
    </div>
    <a href="admin.html" class="info-btn">⚙️ 관리</a>
  </div>
</header>

<div class="trips-layout" id="tripsList">
  <p class="empty-hint" style="margin-top:16px;">불러오는 중...</p>
</div>

<script src="data.js"></script>
<script>
(async function () {
  const el = document.getElementById('tripsList');

  let trips;
  try {
    trips = await fetchTrips();
  } catch (e) {
    el.textContent = '';
    const msg = document.createElement('p');
    msg.className = 'trips-empty';
    msg.textContent = '데이터를 불러오지 못했습니다.';
    el.appendChild(msg);
    return;
  }

  el.textContent = '';

  if (!trips.length) {
    const msg = document.createElement('p');
    msg.className = 'trips-empty';
    msg.textContent = '등록된 여행이 없습니다. 관리 페이지에서 추가해주세요.';
    el.appendChild(msg);
    return;
  }

  function formatDate(d) {
    return d ? d.replace(/-/g, '.') : '';
  }
  function formatDateRange(start, end) {
    if (start && end) return formatDate(start) + ' ~ ' + formatDate(end);
    if (start) return formatDate(start) + ' ~';
    if (end) return '~ ' + formatDate(end);
    return '';
  }

  trips.forEach(function (trip) {
    const a = document.createElement('a');
    a.className = 'trip-card';
    a.href = 'schedule.html?trip=' + encodeURIComponent(trip.id);

    const body = document.createElement('div');
    body.className = 'trip-card-body';

    const title = document.createElement('div');
    title.className = 'trip-card-title';
    title.textContent = trip.title;

    const meta = document.createElement('div');
    meta.className = 'trip-card-meta';
    const dayCount = trip.days ? trip.days.length : 0;
    const dateRange = formatDateRange(trip.start_date, trip.end_date);
    meta.textContent = (dateRange ? dateRange + '  ·  ' : '') + dayCount + '일 일정';

    const arrow = document.createElement('span');
    arrow.className = 'trip-card-arrow';
    arrow.textContent = '→';

    body.appendChild(title);
    body.appendChild(meta);
    a.appendChild(body);
    a.appendChild(arrow);
    el.appendChild(a);
  });
})();
</script>

</body>
</html>
